<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TL Studio</title>
<meta name="description" content="TL Studio makes calm, creative apps for iPhone and iPad.">
<style>
  :root { --bg:#faf8f5; --card:#fff; --text:#1d1d1f; --muted:#6e6e73; --line:#e8e4de; --accent:#0a66ff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --card:#1c1c1e; --text:#f5f5f7; --muted:#a1a1a6; --line:#2c2c2e; --accent:#4c9bff; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:56px 16px 40px; }
  h1 { font-size:28px; margin:0 0 4px; letter-spacing:-.02em; }
  .lead { color:var(--muted); margin:0 0 36px; }
  .app { display:flex; gap:18px; align-items:center; background:var(--card);
         border:1px solid var(--line); border-radius:20px; padding:18px; }
  .app img { width:88px; height:88px; border-radius:20px; flex:none; }
  .app h2 { font-size:19px; margin:0; }
  .app p { margin:4px 0 12px; color:var(--muted); font-size:15px; }
  .btn { display:inline-block; background:var(--text); color:var(--bg); text-decoration:none;
         padding:7px 16px; border-radius:999px; font-size:14px; font-weight:600; }
  footer { margin-top:40px; padding-top:20px; border-top:1px solid var(--line);
           color:var(--muted); font-size:14px; display:flex; flex-wrap:wrap; gap:8px 20px; }
  footer a { color:var(--accent); text-decoration:none; }
  footer a:hover { text-decoration:underline; }
</style>
</head>
<body>
<main>
  <h1>TL Studio</h1>
  <p class="lead">Calm, creative apps for iPhone and iPad.</p>

  <section class="app">
    <img src="tuemi-icon.jpg" alt="Tuemi app icon">
    <div>
      <h2>Tuemi: Musical Coloring Book</h2>
      <p>Paint, play &amp; hear it sing — every stroke you color plays a note.</p>
      <a class="btn" href="https://apps.apple.com/app/id6833788048">View on the App Store</a>
    </div>
  </section>

  <footer>
    <a href="/tlstudio-legal/privacy/">Privacy Policy</a>
    <a href="/tlstudio-legal/terms/">Terms of Use</a>
    <a href="mailto:tlstudio.apps@gmail.com">Contact: tlstudio.apps@gmail.com</a>
    <span>© 2026 Thanh Long Nguyen</span>
  </footer>
</main>
</body>
</html>
